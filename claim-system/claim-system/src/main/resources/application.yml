# Default profile = LOCAL: in-memory H2 database + uploads saved on disk. Run with: mvn spring-boot:run
spring:
  application:
    name: claim-system
  datasource:
    url: jdbc:h2:mem:claimsdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  admin:
    email: ${ADMIN_EMAIL:employee@claims.com}
    password: ${ADMIN_PASSWORD:Employee@123}
  seed-demo-data: true
  storage:
    local-dir: ./uploads
